<svg xmlns="http://www.w3.org/2000/svg" width="860" height="56" viewBox="0 0 860 56" role="img" aria-label="Session closed. Disconnecting.">
  <style>
    text { font-family: 'Cascadia Mono','JetBrains Mono','SF Mono',Consolas,'Courier New',monospace; font-size: 12px; letter-spacing: 1px; }
    .cursor { animation: blink 1.1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" y="2" fill="#000" opacity=".22"/>
    </pattern>
    <clipPath id="frame"><rect width="860" height="56" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="860" height="56" fill="#0a0a0b"/>
    <text x="20" y="33" fill="#5fd08a">■ session closed.</text>
    <text x="160" y="33" fill="#6a6862">trace peaked at 3%. you were never here. the subject knows you were here.</text>
    <rect x="826" y="22" width="8" height="15" fill="#ff8c1a" class="cursor"/>
    <rect width="860" height="56" fill="url(#scan)"/>
  </g>
  <rect x=".5" y=".5" width="859" height="55" rx="10" fill="none" stroke="#2a2a30"/>
</svg>
