<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- very dark orange field -->
  <rect width="64" height="64" rx="12" fill="#2b1300"/>

  <!-- Corridor Corp hexagon: six segments, sides alternating orange / lighter orange -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <line x1="32" y1="10" x2="51.05" y2="21" stroke="#ff8c1a"/>
    <line x1="51.05" y1="21" x2="51.05" y2="43" stroke="#ffbf73"/>
    <line x1="51.05" y1="43" x2="32" y2="54" stroke="#ff8c1a"/>
    <line x1="32" y1="54" x2="12.95" y2="43" stroke="#ffbf73"/>
    <line x1="12.95" y1="43" x2="12.95" y2="21" stroke="#ff8c1a"/>
    <line x1="12.95" y1="21" x2="32" y2="10" stroke="#ffbf73"/>
  </g>

  <!-- command prompt >_ -->
  <g fill="none" stroke="#ffe0b3" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="22,25 30,32 22,39"/>
    <line x1="33" y1="38.5" x2="42" y2="38.5"/>
  </g>
</svg>
